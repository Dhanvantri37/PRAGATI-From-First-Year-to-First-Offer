# ══════════════════════════════════════════════════════
# PRAGATI Resume Parser — Spring Boot Configuration
# ══════════════════════════════════════════════════════

server.port=8080
spring.application.name=pragati-resume-parser

# ── File upload limits ─────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── MySQL JDBC Data Source ─────────────────────────────
# Connection URL format:
#   jdbc:mysql://<host>:<port>/<database>?<options>
#
# Inside Docker Compose the hostname is the service name: mysql
# allowPublicKeyRetrieval=true  — required for MySQL 8 caching_sha2_password
# useSSL=false                  — no SSL inside private Docker network
# serverTimezone=UTC            — prevent timezone mismatch warnings
# createDatabaseIfNotExist=true — auto-create 'pragati_parser' if missing
#
spring.datasource.url=${MYSQL_URL:jdbc:mysql://mysql:3306/pragati_parser?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:pragati_java}
spring.datasource.password=${MYSQL_PASS:pragati_java_secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP Connection Pool ───────────────────────────
# Hikari is Spring Boot's default pool — wraps raw JDBC connections
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
# Retry connecting to MySQL (it starts slower than the Java service)
spring.datasource.hikari.connection-test-query=SELECT 1

# ── Schema initialisation ──────────────────────────────
# Spring Boot runs schema.sql once at startup to create tables
# 'always' means run on every startup (idempotent — uses IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ── Logging ────────────────────────────────────────────
logging.level.com.pragati=INFO
logging.level.org.springframework.jdbc.core=DEBUG
