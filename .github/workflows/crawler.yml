name: PRAGATI RAG Crawler & Daily Announcer

on:
  # ── Daily: Run at 7:00 AM IST (1:30 UTC) — students see fresh jobs when they log in ──
  schedule:
    - cron: '30 1 * * *'   # Daily 7:00 AM IST → Announcement + Push
    - cron: '30 20 * * 6'  # Weekly Sunday 2:00 AM IST → Deep alumni + job crawl

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

jobs:
  daily-announcer:
    name: Daily Opportunities Announcement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run on the 1:30 UTC trigger OR manual daily mode
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily' || github.event.schedule == '30 1 * * *'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run Daily Opportunities Announcer
        working-directory: backend
        env:
          MONGO_URI:          ${{ secrets.MONGO_URI }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          VAPID_PUBLIC_KEY:   ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:  ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL:        ${{ secrets.VAPID_EMAIL }}
          NODE_ENV:           production
        run: node src/utils/dailyOpportunitiesAnnouncer.js

  weekly-crawler:
    name: Weekly Deep Alumni & Job Crawl
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on the Sunday 20:30 UTC trigger OR manual weekly mode
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'weekly' || github.event.schedule == '30 20 * * 6'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run PRAGATI RAG Crawler
        working-directory: backend
        env:
          MONGO_URI:    ${{ secrets.MONGO_URI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NODE_ENV:     production
        run: node src/utils/crawlerWorker.js
