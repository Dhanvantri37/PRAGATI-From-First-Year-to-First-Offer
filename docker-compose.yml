version: '3.9'

# ══════════════════════════════════════════════════════════════════════
# PRAGATI — Docker Compose
#
# Services:
#   mysql          → MySQL 8.1  (JDBC database for resume-parser)
#   mongo          → MongoDB 6  (primary app database for Node.js backend)
#   resume-parser  → Java 17 Spring Boot  (parses PDFs, persists via JDBC→MySQL)
#   ml-service     → Python FastAPI  (SkillPath AI + NLP)
#   backend        → Node.js Express  (REST API)
#   frontend       → React 18 (Nginx-served SPA)
# ══════════════════════════════════════════════════════════════════════

services:

  # ── MySQL 8 ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.1
    container_name: pragati-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_change_me}
      MYSQL_DATABASE:      pragati_parser
      MYSQL_USER:          ${MYSQL_USER:-pragati_java}
      MYSQL_PASSWORD:      ${MYSQL_PASS:-pragati_java_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"         # host:3307 → avoids conflict if local MySQL is on 3306
    networks:
      - pragati-net
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${MYSQL_USER:-pragati_java}",
             "-p${MYSQL_PASS:-pragati_java_secret}"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  # ── MongoDB 6 ────────────────────────────────────────────────────────
  mongo:
    image: mongo:6.0
    container_name: pragati-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pragati}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-pragati_secret}
      MONGO_INITDB_DATABASE: pragati
    volumes:
      - mongo_data:/data/db
      - ./backend/src/utils/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    networks:
      - pragati-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Java Resume Parser (JDBC → MySQL) ───────────────────────────────
  resume-parser:
    build:
      context: ./resume-parser
      dockerfile: Dockerfile
    container_name: pragati-resume-parser
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy   # wait for MySQL to be ready before starting
    environment:
      # JDBC connection — service name 'mysql' resolves inside Docker network
      MYSQL_URL:  "jdbc:mysql://mysql:3306/pragati_parser?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true"
      MYSQL_USER: ${MYSQL_USER:-pragati_java}
      MYSQL_PASS: ${MYSQL_PASS:-pragati_java_secret}
    ports:
      - "8080:8080"
    networks:
      - pragati-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s   # Spring + Maven startup takes ~45s on first run

  # ── Python ML Service ────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: pragati-ml
    restart: on-failure
    environment:
      PYTHONUNBUFFERED: 1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./ml-service/data:/app/data
    ports:
      - "8000:8000"
    networks:
      - pragati-net

  # ── Node.js Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pragati-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: "mongodb://${MONGO_USER:-pragati}:${MONGO_PASS:-pragati_secret}@mongo:27017/pragati?authSource=admin"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      ML_SERVICE_URL: http://ml-service:8000
      RESUME_PARSER_URL: http://resume-parser:8080
      FRONTEND_URL: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      BCRYPT_SALT_ROUNDS: 12
    ports:
      - "5000:5000"
    networks:
      - pragati-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── React Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    container_name: pragati-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - pragati-net

# ── Named volumes ────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  mysql_data:           # persists MySQL data between docker compose restarts
    driver: local

# ── Network ──────────────────────────────────────────────────────────
networks:
  pragati-net:
    driver: bridge
